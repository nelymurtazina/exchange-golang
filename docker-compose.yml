version: '3.8'

services:
  # Сначала запускаем базу данных
  postgres:
    image: postgres:15-alpine
    container_name: exchange_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: exchange
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Отдельный сервис для миграций
  migrate:
    image: migrate/migrate:v4.16.2
    container_name: exchange_migrate
    # Монтируем твою локальную папку с SQL файлами внутрь контейнера
    volumes:
      - ./spotService/migration:/migrations 
      # (или ./userService/migrations, в зависимости от сервиса)
    command: [
      "-path", "/migrations",
      "-database", "postgres://postgres:password@postgres:5432/exchange?sslmode=disable",
      "up"
    ]
    # Ждем, пока postgres станет "healthy" (готовым принимать подключения)
    depends_on:
      postgres:
        condition: service_healthy

  # Go-приложение 
  spot-service:
    build: . # Или путь к Dockerfile
    container_name: spot_service
    ports:
      - "50052:50052"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=exchange
      - REDIS_HOST=redis
     
    # Запускаем приложение ТОЛЬКО после того, как миграции успешно завершатся
    depends_on:
      migrate:
        condition: service_completed_successfully