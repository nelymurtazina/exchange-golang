version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: exchange_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: exchange
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exchange"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - exchange-network

  redis:
    image: redis:7-alpine
    container_name: exchange_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - exchange-network

  user-migrate:
    image: migrate/migrate:v4.16.2
    container_name: user_migrate
    volumes:
      - ./userService/migration:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://postgres:password@postgres:5432/exchange?sslmode=disable&x-migrations-table=user_schema_migrations"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - exchange-network

  spot-migrate:
    image: migrate/migrate:v4.16.2
    container_name: spot_migrate
    volumes:
      - ./spotService/migration:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://postgres:password@postgres:5432/exchange?sslmode=disable&x-migrations-table=spot_schema_migrations"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - exchange-network

  order-migrate:
    image: migrate/migrate:v4.16.2
    container_name: order_migrate
    volumes:
      - ./orderService/migration:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://postgres:password@postgres:5432/exchange?sslmode=disable&x-migrations-table=order_schema_migrations"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - exchange-network

  user-service:
    build:
      context: .
      dockerfile: userService/Dockerfile
    container_name: user_service
    env_file:
      - .env
    ports:
      - "50051:50051"
    depends_on:
      user-migrate:
        condition: service_completed_successfully
    networks:
      - exchange-network

  spot-service:
    build:
      context: .
      dockerfile: spotService/Dockerfile
    container_name: spot_service
    env_file:
      - .env
    ports:
      - "50052:50052" 
    depends_on:
      spot-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - exchange-network

  order-service:
    build:
      context: .
      dockerfile: orderService/Dockerfile
    container_name: order_service
    env_file:
      - .env
    ports:
      - "50053:50053"
    depends_on:
      order-migrate:
        condition: service_completed_successfully
      spot-service:
        condition: service_started
    networks:
      - exchange-network

networks:
  exchange-network:
    driver: bridge

volumes:
  postgres_data: