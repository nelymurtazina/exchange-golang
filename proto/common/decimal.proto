syntax = "proto3";

package common.v1;

option go_package = "grpc-exchange/gen/common;commonv1";

// Decimal представляет десятичное число с высокой точностью
// Используется для количеств, цен, процентных ставок
message Decimal {
    // Целая часть числа
    int64 units = 1;
    
    // Дробная часть (нано, 10^-9)
    // Диапазон: от -999,999,999 до +999,999,999
    // Знак должен совпадать со знаком units
    int32 nanos = 2;
}