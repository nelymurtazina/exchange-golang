# Имя пайплайна, которое ты увидишь в интерфейсе GitHub
name: Run Database Migrations

# Когда запускать этот пайплайн?
on:
  push:
    branches:
      - main # Запускать только когда ты пушишь код в ветку main

# Описание задач (jobs)
jobs:
  # Название задачи
  migrate:
    # На каком "компьютере" (виртуальной машине) это запускать
    runs-on: ubuntu-latest
    
    # Шаги выполнения
    steps:
      # Шаг 1: Скачать твой код из репозитория
      - name: Checkout code
        uses: actions/checkout@v3

      # Шаг 2: Установить Go (так как мы пишем на Go)
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      # Шаг 3: Запустить миграции
      - name: Run migrations
        run: go run ./cmd/migrate/main.go
        # Передаем секретный пароль к базе данных из настроек GitHub
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}