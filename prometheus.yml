global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'order_service'
    static_configs:
      - targets: ['host.docker.internal:9091']  # ← ИЗМЕНЕНО
    metrics_path: '/metrics'

  - job_name: 'spot_instrument_service'
    static_configs:
      - targets: ['host.docker.internal:9092']  # ← ИЗМЕНЕНО
    metrics_path: '/metrics'

  - job_name: 'user_service'
    static_configs:
      - targets: ['host.docker.internal:9093']  # ← ИЗМЕНЕНО
    metrics_path: '/metrics'